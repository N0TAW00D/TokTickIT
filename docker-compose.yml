services:
  postgres:
      image: postgres:18
      container_name: local-postgres
      environment:
        POSTGRES_DB: localdb
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      ports:
        - "5432:5432"
      volumes:
        - complete_postgres_data:/var/lib/postgresql
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 10s
        timeout: 5s
        retries: 5
      restart: unless-stopped

volumes:
  complete_postgres_data: